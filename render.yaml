services:
  # Python Backend Web Service
  - type: web
    name: sddds-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    disk:
      name: db-volume
      mountPath: /app/db_volume
      sizeGB: 1
  # Vite React Frontend Static Web Service
  - type: web
    name: sddds-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://sddds-backend.onrender.com
